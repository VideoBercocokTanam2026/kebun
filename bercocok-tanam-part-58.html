<script>
  /* =====================================================================
     Video halaman ini (diisi otomatis oleh generate.py). Daftar "Video
     Lainnya" diambil otomatis (fetch) dari videos.json setiap halaman
     dibuka — halaman ini tidak perlu diupload ulang kalau ada video baru.
     ===================================================================== */
  const CURRENT_VIDEO_ID = "1ez9fgpyk34FfuXfpuaSlesSPjnu08aWm";

  /* =====================================================================
     KONFIGURASI IKLAN — berdasarkan data revenue Adsterra nyata.
     Ubah true/false untuk menyalakan/mematikan satu jenis iklan.
     ===================================================================== */
  const AD_CONFIG = {
    topBanner: true,          // 728x90 desktop / 320x50 mobile di bagian atas
    inContentRotation: true   // baris iklan di antara video
  };

  // Urutan & pengulangan menentukan FREKUENSI kemunculan tiap ukuran.
  // 320x50, 300x250, Native diulang lebih banyak (revenue/CPM terbaik).
  // 160x300 / 160x600 / 468x60 tetap aktif tapi ditaruh paling jarang
  // (revenue sangat rendah berdasarkan data, tapi tidak dihapus).
  const ROTATION_POOL = [
    { type:'banner', key:'31ecdbf5858a594406627c7268f204d3', width:320, height:50 },
    { type:'banner', key:'31ecdbf5858a594406627c7268f204d3', width:320, height:50 },
    { type:'banner', key:'31ecdbf5858a594406627c7268f204d3', width:320, height:50 },
    { type:'banner', key:'4d27f935deba9bc05166c12b06b00c42', width:300, height:250 },
    { type:'banner', key:'4d27f935deba9bc05166c12b06b00c42', width:300, height:250 },
    { type:'native', key:'bb545ebcedb7e3fde88a08926f7600ff' },
    { type:'native', key:'bb545ebcedb7e3fde88a08926f7600ff' },
    { type:'banner', key:'a43bb6b4655190fce3e4a83e3a6f8096', width:160, height:300 },
    { type:'banner', key:'07dd379c65a286df957d7db39551703c', width:160, height:600 },
    { type:'banner', key:'8c6e050c99eec8e0783e1d332b9cdedf', width:468, height:60  }
  ];

  function renderBannerAd(container, ad){
    const iframe = document.createElement('iframe');
    iframe.style.width = ad.width + 'px';
    iframe.style.height = ad.height + 'px';
    iframe.style.maxWidth = '100%';
    iframe.scrolling = 'no';
    container.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(
      '<script>atOptions={"key":"' + ad.key + '","format":"iframe","height":' + ad.height + ',"width":' + ad.width + ',"params":{}};<\/script>' +
      '<script src="https://www.highperformanceformat.com/' + ad.key + '/invoke.js"><\/script>'
    );
    doc.close();
  }

  function renderNativeAd(container, ad){
    const holder = document.createElement('div');
    holder.id = 'container-' + ad.key;
    container.appendChild(holder);
    const script = document.createElement('script');
    script.async = true;
    script.setAttribute('data-cfasync', 'false');
    script.src = 'https://pl30819270.effectivecpmnetwork.com/' + ad.key + '/invoke.js';
    container.appendChild(script);
  }

  // rotationCounter untuk ambil giliran ukuran berikutnya dari ROTATION_POOL.
  let rotationCounter = 0;
  function nextAd(){
    const ad = ROTATION_POOL[rotationCounter % ROTATION_POOL.length];
    rotationCounter++;
    return ad;
  }
  function insertAdRow(container, forcedAd){
    if(!AD_CONFIG.inContentRotation) return;
    const wrap = document.createElement('div');
    wrap.className = 'ad-row';
    wrap.innerHTML = '<span class="ad-label">Iklan</span>';
    container.appendChild(wrap);

    const ad = forcedAd || nextAd();
    if(ad.type === 'native'){
      renderNativeAd(wrap, ad);
    } else {
      renderBannerAd(wrap, ad);
    }
  }

  function extractDriveId(link){
    const patterns = [
      /\/d\/([a-zA-Z0-9_-]{10,})/,
      /[?&]id=([a-zA-Z0-9_-]{10,})/
    ];
    for(const p of patterns){
      const m = link.match(p);
      if(m) return m[1];
    }
    return link.trim();
  }

  function slugify(str){
    return str.toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  function makeVideoFrame(driveId, judul, autoLoad, linkToPage, coverUrl){
    const frame = document.createElement(autoLoad ? 'div' : 'a');
    frame.className = 'video-frame';
    if(!autoLoad) frame.href = linkToPage;
    if(autoLoad){
      frame.innerHTML = `<iframe src="https://drive.google.com/file/d/${driveId}/preview?autoplay=1" allow="autoplay" allowfullscreen></iframe>`;
    } else {
      const driveThumb = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
      const thumbSrc = coverUrl || driveThumb;
      frame.innerHTML = `
        <img class="video-thumb" src="${thumbSrc}" alt="${judul}" loading="lazy" onerror="this.onerror=null;this.src='${driveThumb}';">
        <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      `;
    }
    return frame;
  }

  function init(VIDEOS){
    const targetIndex = VIDEOS.findIndex(v => v.driveId === CURRENT_VIDEO_ID);
    if(targetIndex === -1) return;

    const v = VIDEOS[targetIndex];
    const episodeNumber = VIDEOS.length - targetIndex;

    const mainWrap = document.getElementById('main-video');
    const card = document.createElement('div');
    card.className = 'main-card';
    card.innerHTML = `
      <div class="card-meta">
        <span>EPISODE ${String(episodeNumber).padStart(2,'0')}</span>
        <span>${v.tanggal}</span>
      </div>
      <h2>${v.judul}</h2>
      ${v.deskripsi ? `<p class="desc">${v.deskripsi}</p>` : ''}
    `;
    const frame = makeVideoFrame(CURRENT_VIDEO_ID, v.judul, false, '#', `covers/${slugify(v.judul)}.png`);
    frame.addEventListener('click', (e) => {
      e.preventDefault();
      const playing = makeVideoFrame(CURRENT_VIDEO_ID, v.judul, true, '#');
      frame.replaceWith(playing);
    });
    card.appendChild(frame);
    mainWrap.appendChild(card);

    insertAdRow(document.getElementById('ad-after-main'), ROTATION_POOL[0]);

    const others = VIDEOS.filter((_, i) => i !== targetIndex);
    if(others.length){
      document.getElementById('other-heading').style.display = 'block';
      const otherWrap = document.getElementById('other-videos');
      others.forEach(o => {
        const oId = o.driveId;
        const oPage = slugify(o.judul) + '.html';
        const oCard = document.createElement('div');
        oCard.className = 'other-card';
        const oFrame = makeVideoFrame(oId, o.judul, false, oPage, `covers/${slugify(o.judul)}.png`);
        oCard.appendChild(oFrame);
        const meta = document.createElement('div');
        meta.className = 'card-meta';
        meta.style.marginTop = '10px';
        meta.innerHTML = `<span>${o.tanggal}</span>`;
        oCard.appendChild(meta);
        const h3 = document.createElement('h3');
        h3.innerHTML = `<a href="${oPage}">${o.judul}</a>`;
        oCard.appendChild(h3);
        otherWrap.appendChild(oCard);

        insertAdRow(otherWrap);
      });
    }
  }

  fetch('videos.json')
    .then(r => r.json())
    .then(data => init(data))
    .catch(err => console.error('Gagal memuat videos.json', err));
  if(AD_CONFIG.topBanner){
    renderBannerAd(document.getElementById('ad-top-728x90'), { key:'cf6aef4585c4817c49bab5e3f1077dc9', width:728, height:90 });
    renderBannerAd(document.getElementById('ad-top-320x50'), { key:'31ecdbf5858a594406627c7268f204d3', width:320, height:50 });
  }
</script>
